services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "4000:4000"
    environment:
      MONGO_URI: mongodb://mongo:27017/uptime
    depends_on:
      - mongo

volumes:
  mongo-data:
