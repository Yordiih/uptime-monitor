services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "4000:4000"
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/uptime}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    depends_on:
      - mongo

volumes:
  mongo-data:
