services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "4000:4000"
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/uptime}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      TRUST_PROXY: "1"
    depends_on:
      - mongo

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    ports:
      - "4100:4100"
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/uptime}
    depends_on:
      - mongo

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - api

volumes:
  mongo-data:
